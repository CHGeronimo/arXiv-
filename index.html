<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arxivSCI-daily</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/subscriptions.css">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>arxivSCI-daily</h1>
        </div>
        <div class="header-right">
            <input id="search-input" type="text" placeholder="搜索论文..." oninput="handleSearch()" class="search-bar">
            <input id="date-filter" type="date" class="date-filter" onchange="handleDateFilter()" title="按日期筛选">
            <button id="sort-btn" class="sort-btn" onclick="toggleSort()" title="按日期排序">↓ 新→旧</button>
            <span id="paper-count" class="paper-count"></span>
            <button onclick="openProfileModal()" class="gear-btn" title="研究方向">🎯</button>
            <button onclick="openSubscriptionModal()" class="gear-btn" title="订阅管理">⚙️</button>
        </div>
    </header>

    <div class="filter-bar">
        <div class="filter-dropdown" id="dd-source">
            <button class="filter-dropdown-btn" onclick="toggleDropdown('source')">
                来源 <span class="badge" id="badge-source" style="display:none">0</span> <span class="arrow">▼</span>
            </button>
            <div class="filter-dropdown-panel" id="panel-source"></div>
        </div>
        <div class="filter-dropdown" id="dd-journal">
            <button class="filter-dropdown-btn" onclick="toggleDropdown('journal')">
                期刊 <span class="badge" id="badge-journal" style="display:none">0</span> <span class="arrow">▼</span>
            </button>
            <div class="filter-dropdown-panel" id="panel-journal"></div>
        </div>
        <div class="filter-dropdown" id="dd-category">
            <button class="filter-dropdown-btn" onclick="toggleDropdown('category')">
                领域 <span class="badge" id="badge-category" style="display:none">0</span> <span class="arrow">▼</span>
            </button>
            <div class="filter-dropdown-panel" id="panel-category"></div>
        </div>
        <div class="filter-dropdown" id="dd-type">
            <button class="filter-dropdown-btn" onclick="toggleDropdown('type')">
                类型 <span class="badge" id="badge-type" style="display:none">0</span> <span class="arrow">▼</span>
            </button>
            <div class="filter-dropdown-panel" id="panel-type"></div>
        </div>
        <button class="clear-filters-btn" onclick="clearAllFilters()">清除筛选</button>
    </div>

    <main id="paper-container">
        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <span>正在加载论文...</span>
        </div>
    </main>

    <!-- Paper Detail Modal -->
    <div id="paper-modal" class="modal" onclick="if(event.target===this)closePaperModal()">
        <div class="modal-content">
            <button class="close-btn" onclick="closePaperModal()">&times;</button>
            <div id="paper-detail"></div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal" onclick="if(event.target===this)closeProfileModal()">
        <div class="modal-content">
            <button class="close-btn" onclick="closeProfileModal()">&times;</button>
            <h2 style="margin-bottom:12px">研究方向设置</h2>
            <label style="font-size:0.85rem;color:var(--text-secondary)">研究方向描述</label>
            <textarea id="profile-direction" rows="3" style="width:100%;margin:4px 0 12px;padding:8px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-size:0.85rem;resize:vertical" placeholder="描述你的研究方向..."></textarea>
            <label style="font-size:0.85rem;color:var(--text-secondary)">关键词（逗号分隔）</label>
            <input id="profile-keywords" type="text" style="width:100%;margin:4px 0 12px;padding:8px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-size:0.85rem" placeholder="neural rendering, 3D reconstruction...">
            <label style="font-size:0.85rem;color:var(--text-secondary)">质量标准（可选）</label>
            <input id="profile-quality" type="text" style="width:100%;margin:4px 0 12px;padding:8px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-size:0.85rem" placeholder="Prioritize papers with strong results...">
            <button onclick="saveProfile()" class="follow-btn" style="width:100%">保存</button>
        </div>
    </div>

    <!-- Subscription Modal -->
    <div id="subscription-modal" class="subscription-modal" onclick="if(event.target===this)closeSubscriptionModal()">
        <div class="subscription-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <h2>订阅管理</h2>
                <button onclick="closeSubscriptionModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer">&times;</button>
            </div>
            <div class="sub-tabs">
                <div class="sub-tab active" onclick="switchSubTab('arxiv', this)">arXiv 分类</div>
                <div class="sub-tab" onclick="switchSubTab('crossref', this)">期刊订阅</div>
            </div>
            <div id="sub-tab-arxiv">
                <p>选择关注的 arXiv 分类：</p>
                <div id="arxiv-categories-chips"></div>
            </div>
            <div id="sub-tab-crossref" style="display:none">
                <input id="journal-search-input" type="text" placeholder="搜索期刊名称..." oninput="handleJournalSearch()" style="width:100%;padding:8px;margin-bottom:8px;box-sizing:border-box">
                <div id="journal-search-results"></div>
                <hr style="margin:16px 0">
                <h3>已订阅期刊</h3>
                <div id="crossref-journals-list"></div>
            </div>
        </div>
    </div>

    <script src="js/subscriptions.js"></script>
    <script src="js/crossref-search.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
